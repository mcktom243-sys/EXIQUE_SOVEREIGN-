<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUKE INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-yellow: #ffd700; --bg-dark: #050505; --surface-dark: #121212; --glass-bg: rgba(20, 20, 20, 0.98); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: #e0e0e0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--primary-yellow); background: #000; padding: 6px 14px; border: 1px solid var(--primary-yellow); border-radius: 4px; letter-spacing: 2px; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 160px; }
        .msg { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: 0.97rem; }
        .user-msg { align-self: flex-end; background: var(--primary-yellow); color: #000; font-weight: 600; }
        .bot-msg { align-self: flex-start; background: var(--surface-dark); border: 1px solid #333; }
        
        .input-wrapper { position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 1000; }
        .input-bar { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid #444; padding: 8px 12px; border-radius: 9999px; display: flex; align-items: end; gap: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); }
        textarea { flex: 1; background: transparent; border: none; color: white; padding: 14px 16px; outline: none; font-size: 1.02rem; resize: none; max-height: 200px; min-height: 52px; line-height: 1.45; }
        .send-btn { background: var(--primary-yellow); border: none; border-radius: 50%; width: 46px; height: 46px; cursor: pointer; color: #000; font-size: 1.2rem; align-self: flex-end; margin-bottom: 5px; }
        
        #admin-panel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 440px; height: 100%; background: #0a0a0a; border-right: 3px solid var(--primary-yellow); transition: 0.3s ease; z-index: 2000; padding: 25px; overflow-y: auto; }
        #admin-panel.open { left: 0; }
        .admin-section { background: #1a1a1a; padding: 18px; border-radius: 12px; margin-bottom: 20px; }
        .admin-btn { width: 100%; padding: 13px; margin: 8px 0; background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
        .status { padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 0.92rem; }
        #file-list { max-height: 220px; overflow-y: auto; background: #111; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <div onclick="toggleAdmin()" style="cursor:pointer; color:var(--primary-yellow); font-size: 1.6rem;">☰</div>
        <div class="logo">NUKE</div>
        <div></div>
    </header>
    
    <div id="messages"></div>
    
    <div class="input-wrapper">
        <div class="input-bar">
            <textarea id="message-input" placeholder="Message NUKE AI..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    
    <div id="admin-panel">
        <h2 style="color:var(--primary-yellow); margin-bottom: 20px;">SYSTEM CONTROL</h2>
        
        <button class="admin-btn" onclick="saveChat()">💾 Save Chat</button>
        <button class="admin-btn" onclick="loadChat()">📂 Load Last Saved</button>
        <button class="admin-btn" onclick="deleteChat()" style="color:#ff6666;">🗑️ Delete All</button>
        
        <div class="admin-section">
            <h3 style="color:var(--primary-yellow)">Ollama Server</h3>
            <input id="ollama-url" type="text" value="http://127.0.0.1:11434" style="width:100%; padding:12px; background:#222; border:1px solid #555; color:white; border-radius:8px; margin-bottom:10px;">
            <button class="admin-btn" onclick="testOllamaConnection()" style="background:#ffd700;color:#000;font-weight:bold;">🔍 TEST CONNECTION</button>
            <div id="ollama-status" class="status"></div>
        </div>
        
        <div class="admin-section">
            <h3 style="color:var(--primary-yellow)">Select Files for AI Context</h3>
            <p style="font-size:0.85rem; color:#aaa; margin-bottom:12px;">You can select multiple files (brain.py, docs, etc.)</p>
            <button class="admin-btn" onclick="selectMultipleFiles()" style="background:#ffd700;color:#000;">📎 SELECT FILES</button>
            <div id="file-list">No files selected yet.</div>
            <button class="admin-btn" onclick="applyContext()" style="background:#ffd700;color:#000;">🚀 Apply Selected Files as Context</button>
        </div>
        
        <button onclick="toggleAdmin()" class="admin-btn">CLOSE</button>
    </div>

    <input type="file" id="multi-file-input" multiple style="display:none" onchange="handleFilesSelected(event)">

    <script>
        const msgs = document.getElementById('messages');
        let selectedFiles = [];

        function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('open'); }

        function saveChat() { localStorage.setItem('nuke_chat', msgs.innerHTML); alert("✅ Saved"); }
        function loadChat() { 
            const data = localStorage.getItem('nuke_chat'); 
            if(data) { msgs.innerHTML = data; alert("✅ Loaded"); } 
            else alert("No save found"); 
        }
        function deleteChat() { if(confirm("Clear all?")) { msgs.innerHTML=''; localStorage.removeItem('nuke_chat'); } }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text) return;
            const div = document.createElement('div'); 
            div.className='msg user-msg'; 
            div.innerText = text;
            msgs.appendChild(div); 
            msgs.scrollTop = msgs.scrollHeight;
            input.value = ''; 
            input.style.height = 'auto';
        }

        function handleKeyDown(e) {
            const ta = document.getElementById('message-input');
            setTimeout(() => {
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
            }, 10);
            if (e.key === 'Enter' && (e.ctrlKey || e.shiftKey)) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function testOllamaConnection() {
            const url = document.getElementById('ollama-url').value.trim();
            const status = document.getElementById('ollama-status');
            status.textContent = "Testing connection...";
            status.style.background = "#334";
            try {
                const res = await fetch(url + '/api/version', {mode: 'no-cors', signal: AbortSignal.timeout(6000)});
                status.innerHTML = `✅ Connected to ${url}`;
                status.style.background = "#1a3a1a";
            } catch(e) {
                status.innerHTML = `❌ Connection failed.<br>Is Ollama running?`;
                status.style.background = "#3a1a1a";
            }
        }

        function selectMultipleFiles() {
            document.getElementById('multi-file-input').click();
        }

        function handleFilesSelected(e) {
            selectedFiles = Array.from(e.target.files);
            let html = '<strong>Selected Files:</strong><br>';
            selectedFiles.forEach(f => {
                html += `• ${f.name} <small>(${(f.size/1024).toFixed(1)} KB)</small><br>`;
            });
            document.getElementById('file-list').innerHTML = html || 'No files selected';
        }

        function applyContext() {
            if (selectedFiles.length > 0) {
                alert(`✅ ${selectedFiles.length} file(s) applied as AI context!\nThe AI can now use their content.`);
            } else {
                alert("Select some files first.");
            }
        }

        window.onload = () => {
            const ta = document.getElementById('message-input');
            ta.addEventListener('input', () => {
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
            });
        };
    </script>
</body>
</html>
